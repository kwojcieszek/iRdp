# XcodeGen spec for iRdp.xcodeproj. Regenerate with: xcodegen generate (in src).
name: iRdp
options:
  bundleIdPrefix: com.kwojcieszek
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: RMCMJSS2J3
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  iRdpPackage:
    path: .
targets:
  iRdpService:
    type: tool
    platform: macOS
    sources:
      - Sources/iRdpService
    dependencies:
      - package: iRdpPackage
        product: IRdpServiceCore
    settings:
      base:
        PRODUCT_NAME: iRdpService
        PRODUCT_BUNDLE_IDENTIFIER: com.kwojcieszek.irdp.service
        SKIP_INSTALL: YES
  iRdp:
    type: application
    platform: macOS
    sources:
      - Sources/iRdp
      - path: Resources/com.kwojcieszek.irdp.service.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: iRdpPackage
        product: IRdpConfiguration
      - package: iRdpPackage
        product: MacIntegration
      - target: iRdpService
        copy:
          destination: executables
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: iRdp
        PRODUCT_BUNDLE_IDENTIFIER: com.kwojcieszek.irdp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
schemes:
  iRdp:
    build:
      targets:
        iRdp: all
    run:
      config: Debug
    test:
      config: Debug
